<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2b3a1a" />
    <meta name="description" content="Touch grass without going outside. An interactive 3D meadow." />
    <title>Touch Grass</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M6 28 C7 18 8 12 6 6 C11 12 12 20 12 28 Z M13 28 C14 16 17 9 21 3 C21 12 19 20 19 28 Z M20 28 C21 20 24 15 28 12 C27 19 26 24 26 28 Z' fill='%2388c92f'/%3E%3C/svg%3E" />
  </head>
  <body>
    <canvas id="scene" aria-label="Interactive grass meadow"></canvas>

    <div class="pill" id="pill" role="tablist" aria-label="Time of day">
      <span class="pill-thumb" id="thumb"></span>
      <button role="tab" data-time="morning" aria-selected="false">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>
        <span>Morning</span>
      </button>
      <button role="tab" data-time="golden" aria-selected="true">
        <svg viewBox="0 0 24 24"><path d="M3 19h18M6 19a6 6 0 0 1 12 0M12 8v2.5M5.6 11.6l1.6 1.6M18.4 11.6l-1.6 1.6"/></svg>
        <span>Golden</span>
      </button>
      <button role="tab" data-time="night" aria-selected="false">
        <svg viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
        <span>Night</span>
      </button>
    </div>

    <svg id="hand" class="hand" viewBox="0 0 48 48" aria-hidden="true">
      <g class="hand-open">
        <path d="M17 24V12.5a2.5 2.5 0 0 1 5 0V23m0-12.5v-2a2.5 2.5 0 0 1 5 0V23m0-11.5a2.5 2.5 0 0 1 5 0V25m0-9.5a2.5 2.5 0 0 1 5 0V30c0 7-4.5 12-11.5 12-5 0-8-2.5-10.5-6.5L9 28.500c-1-1.700.9-3.600 2.600-2.600L17 29" />
      </g>
      <g class="hand-grab">
        <path d="M14 22.500a3 3 0 0 1 5-2.200 3 3 0 0 1 5-1 3 3 0 0 1 5 .2 3 3 0 0 1 5.500 1.500V30c0 7-4.500 11-11 11-5.500 0-9-3.500-9-8z" />
        <path d="M19 21v5m5-7v6m5-5v5" />
      </g>
    </svg>

    <p class="hint" id="hint">move your hand through the grass</p>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
